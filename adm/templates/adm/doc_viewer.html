                            <div class="text-center py-5 bg-white rounded-4 shadow-sm border p-4 mx-auto" style="max-width: 600px;">
                                <i class="bi bi-file-excel text-success display-3 mb-3 d-block"></i>
                                <h5 class="fw-bold">${cleanName}</h5>
                                <p class="text-muted">Could not render spreadsheet data directly.</p>
                                <a href="${fileUrl}" download="${cleanName}" class="btn btn-warning rounded-pill px-4 fw-bold">
                                    <i class="bi bi-download me-1"></i> Download Spreadsheet
                                </a>
                            </div>
                        `).show();
                    });
            } else if (isPpt(cleanName)) {
                let updateProgress = showPreviewProgressCard(cleanName, $container, $spinner);
                fetchWithProgress(fileUrl, updateProgress)
                    .then(buffer => {
                        $spinner.hide();
                        renderPptxSlides(buffer, cleanName, $container, $spinner, fileUrl, ext);
                    })
                    .catch(err => {
                        $spinner.hide();
                        $container.html(`
                            <div class="text-center py-5 bg-white rounded-4 shadow-sm border p-4 mx-auto" style="max-width: 600px;">
                                <i class="bi bi-file-ppt text-warning display-3 mb-3 d-block"></i>
                                <h5 class="fw-bold">${cleanName}</h5>
                                <p class="text-muted">PowerPoint presentation file ready for download.</p>
                                <a href="${fileUrl}" download="${cleanName}" class="btn btn-warning rounded-pill px-4 fw-bold">
                                    <i class="bi bi-download me-1"></i> Download PowerPoint File
                                </a>
                            </div>
                        `).show();
                    });
            } else if (isPdf(cleanName)) {
                $spinner.hide();
                renderPdfDocument(fileUrl, cleanName, $container, $spinner, ext);
            } else if (isImage(cleanName)) {
                $spinner.hide();
                $container.html(`
                    <div class="text-center py-3">
                        <img src="${fileUrl}" class="img-fluid rounded-4 shadow-sm" style="max-height: 82vh; object-fit: contain;">
                    </div>
                `).show();
            } else if (isVideo(cleanName)) {
                $spinner.hide();
                $container.html(`
                    <div class="text-center py-3 max-w-900 mx-auto">
                        <video controls autoplay src="${fileUrl}" style="max-width: 100%; max-height: 82vh; border-radius: 12px;"></video>
                    </div>
                `).show();
            } else if (isAudio(cleanName)) {
                $spinner.hide();
                $container.html(`
                    <div class="text-center py-4 p-md-5 bg-white rounded-4 shadow-sm border max-w-600 mx-auto">
                        <i class="bi bi-disc-fill text-info vinyl-spin display-3 mb-3 d-block"></i>
                        <h6 class="fw-bold text-dark mb-3 text-break">${cleanName}</h6>
                        <audio controls autoplay src="${fileUrl}" style="width: 100%;" class="shadow-sm rounded-pill"></audio>
                    </div>
                `).show();
            } else if (isTextFile(cleanName)) {
                let updateProgress = showPreviewProgressCard(cleanName, $container, $spinner);
                fetchTextChunkWithProgress(fileUrl, 524288, updateProgress)
                    .then(res => {
                        $spinner.hide();
                        let safeText = $('<div>').text(res.text).html();
                        let noticeHtml = '';
                        if (res.isPartial && res.totalBytes > res.loadedBytes) {
                            noticeHtml = `
                                <div class="alert alert-info py-2 px-3 mb-3 small d-flex justify-content-between align-items-center rounded-3 border">
                                    <span class="small font-monospace text-dark"><i class="bi bi-info-circle-fill text-info me-1"></i> Streaming Preview: Displaying first ${formatBytes(res.loadedBytes)} of ${formatBytes(res.totalBytes)}</span>
                                    <a href="${fileUrl}" download="${cleanName}" class="btn btn-sm btn-dark rounded-pill py-1 px-3 fw-bold">Download Full File</a>
                                </div>
                            `;
                        }
                        $container.html(`
                            <div class="bg-dark p-4 rounded-4 shadow-sm border mx-auto" style="max-width: 1100px;">
                                ${noticeHtml}
                                <pre class="text-light mb-0" style="max-height: 76vh; overflow: auto; font-family: 'Consolas', 'Monaco', monospace; font-size: 0.9rem; white-space: pre-wrap; word-break: break-all;"><code>${safeText}</code></pre>
                            </div>
                        `).show();
                    })
                    .catch(err => {
                        $spinner.hide();
                        $container.html(`
                            <div class="text-center py-5 bg-white rounded-4 shadow-sm border p-4 mx-auto" style="max-width: 600px;">
                                <i class="bi bi-file-earmark-text text-secondary display-3 mb-3 d-block"></i>
                                <h5 class="fw-bold">${cleanName}</h5>
                                <p class="text-muted">Could not load text file content.</p>
                            </div>
                        `).show();
                    });
            } else {
                $spinner.hide();
                $container.html(`
                    <div class="text-center py-5 bg-white rounded-4 shadow-sm border p-4 mx-auto" style="max-width: 600px;">
                        <i class="bi bi-file-earmark-text text-secondary display-3 mb-3 d-block"></i>
                        <h5 class="fw-bold">${cleanName}</h5>
                        <p class="text-muted">Direct browser view not available for this file type (${ext ? ext.toUpperCase() : 'FILE'}).</p>
                        <a href="${fileUrl}" download="${cleanName}" class="btn btn-warning rounded-pill px-4 fw-bold">
                            <i class="bi bi-download me-1"></i> Download File
                        </a>
                    </div>
                `).show();
            }
        });
    </script>
</body>
</html>
